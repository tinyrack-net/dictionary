# Source datasets and the dictionaries built from them.
#
# Sources (type defaults to "kaikki"):
#   kaikki - Wiktextract JSONL dump from kaikki.org
#            edition  = Wiktionary edition path ("dictionary" = English Wiktionary,
#                       "kowiktionary" = Korean Wiktionary, ...)
#            language = language page name inside that edition
#   krdict - 한국어기초사전 (Basic Korean Dictionary, NIKL) full JSON export
#
# Dictionaries reference sources by id and pick a builder:
#   wiktextract - render entries with PyGlossary's Wiktextract reader
#   bilingual   - combine translation lists and target-language glosses
#   krdict      - 한국어기초사전 entries with translations in options.target_lang
#   krdict-reverse - options.target_lang terms -> the 한국어기초사전 entries using them

[sources.enwiktionary-en]
edition = "dictionary"
language = "English"

[sources.kowiktionary-en]
edition = "kowiktionary"
language = "영어"

[sources.krdict]
type = "krdict"

[[dictionaries]]
id = "wiktionary-en"
name = "Wiktionary English"
builder = "wiktextract"
sources = ["enwiktionary-en"]
min_entries = 1_000_000
checks = [
  { query = "dictionary", contains = "IPA" },
  { query = "serendipity", contains = "luck" },
  { query = "went", headword = "go" },
  { query = "dictionaries", headword = "dictionary" },
]

[[dictionaries]]
id = "wiktionary-en-ko"
name = "Wiktionary 영한"
builder = "bilingual"
sources = ["enwiktionary-en", "kowiktionary-en"]
min_entries = 25_000
checks = [
  { query = "bank", contains = "은행" },
  { query = "dictionary", contains = "사전" },
  { query = "went", headword = "go" },
]

[dictionaries.options]
target_lang = "ko"
translations_source = "enwiktionary-en"
glosses_source = "kowiktionary-en"

[[dictionaries]]
id = "krdict-ko-en"
name = "한국어기초사전 한영"
builder = "krdict"
sources = ["krdict"]
min_entries = 50_000
checks = [
  { query = "사과", contains = "apple" },
  { query = "배", contains = "boat" },
  # The export lists a few conjugations per verb (먹어, 먹으니, 먹는, 먹습니다).
  { query = "먹어", headword = "먹다" },
  { query = "예뻐", headword = "예쁘다" },
]

[dictionaries.options]
target_lang = "영어"

[[dictionaries]]
id = "krdict-en-ko"
name = "한국어기초사전 영한"
builder = "krdict-reverse"
sources = ["krdict"]
min_entries = 40_000
checks = [
  { query = "apple", contains = "사과" },
  { query = "ship", contains = "배²" },
  { query = "beautiful", contains = "아름답다" },
  { query = "eat", contains = "먹다²" },
]

[dictionaries.options]
target_lang = "영어"
