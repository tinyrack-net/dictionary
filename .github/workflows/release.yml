name: Release

on:
  schedule:
    # Kaikki and krdict refresh data roughly weekly.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the latest release already has the current data and code
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for new data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.compare.outputs.fingerprint }}
      build: ${{ steps.compare.outputs.build }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Read source metadata
        run: uv run tinydict fetch --metadata-only

      - name: Compare with the latest release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          # The release notes of every build end with its fingerprint (a hash of
          # source versions, config, code and lockfile).
          fingerprint="$(uv run tinydict fingerprint)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          latest="$(gh release view --json body --jq .body 2>/dev/null || true)"
          if [ "$FORCE" != "true" ] && grep -qF "$fingerprint" <<< "$latest"; then
            echo "The latest release already has build $fingerprint; nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $fingerprint." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Download source data
        run: uv run tinydict fetch

      - name: Check sources are unchanged
        env:
          EXPECTED: ${{ needs.check.outputs.fingerprint }}
        run: |
          fingerprint="$(uv run tinydict fingerprint)"
          if [ "$fingerprint" != "$EXPECTED" ]; then
            echo "Source data changed during the run ($EXPECTED -> $fingerprint); retry later." >&2
            exit 1
          fi

      - name: Build dictionaries
        run: uv run tinydict build

      - name: Write release notes
        run: uv run tinydict release-notes > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag v<UTC build date>.<run number>, e.g. v2026.10.22.14. GitHub
          # orders releases by tag version, so the newest build is always on top.
          date="$(date -u +%Y.%m.%d)"
          tag="v$date.$GITHUB_RUN_NUMBER"
          # Upload exactly the assets listed in the manifest (every format).
          mapfile -t assets < <(jq -r '.dictionaries[].asset | "dist/" + .' dist/manifest.json)
          assets+=(dist/manifest.json)
          ls -l "${assets[@]}"
          gh release create "$tag" "${assets[@]}" \
            --title "Dictionaries ${date//./-}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
